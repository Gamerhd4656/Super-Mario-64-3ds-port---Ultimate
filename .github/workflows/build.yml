name: Build SM64 3DS Port

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install additional dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config python3 git curl libzip-dev libaudiofile-dev bsdmainutils

      - name: Build and compile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$PATH:/opt/devkitpro/tools/bin

          # Remove incompatible warning flags from the makefiles so GCC doesn't crash
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-Wno-error=redeclared-without-attribute-visibility//g' || true

          # Copy project asset overrides if they exist
          cp project_asset_overrides/* . || true

          # Build the project - PLATFORM_CFLAGS in the Makefile already
          # includes both the libctru include path and the N64 "include"
          # directory (for ultra64.h / PR/ultratypes.h), so CFLAGS must
          # NOT be overridden on the command line here.
          # Only building the .3dsx target (no CIA), since that doesn't
          # require bannertool, which isn't installed in this container.
          make VERSION=us -j4

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-3ds-port
          path: |
            build/us_3ds/*.3dsx

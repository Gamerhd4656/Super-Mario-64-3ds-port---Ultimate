name: Build SM64 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (git, build-essentials, libpng-dev)
        run: |
          apt-get update && apt-get install -y --no-install-recommends git build-essential libpng-dev wget curl bsdmainutils

      - name: Install devkitPro toolchain and tools
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm picasso 3dstools general-tools

      - name: Install Bannertool
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git clone --recursive https://github.com/Epicpkmn11/bannertool.git /tmp/bannertool
          cd /tmp/bannertool
          make
          mkdir -p /opt/devkitpro/tools/bin/
          cp output/linux-x86_64/bannertool /opt/devkitpro/tools/bin/

      - name: Build SM64 3DS (.3dsx and .cia)
        run: |
          export PATH=$PATH:/opt/devkitpro/tools/bin
          make TARGET_N3DS=1 -j$(nproc)
          make TARGET_N3DS=1 cia

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-3ds-artifacts
          path: |
            build/*/*.3dsx
            build/*/*.cia

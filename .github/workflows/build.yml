name: Build SM64 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 3DS Dependencies (bannertool & picasso)
        run: |
          dkmaint --refresh || dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm 3ds-bannertool 3ds-picasso

      - name: Prepare Base Assets
        run: |
          # Place your baserom.us.z64 here or handle asset extraction depending on your setup
          # e.g., if you store it as a secret or repo file.
          ls -la

      - name: Build SM64 3DS (.3dsx and .cia)
        run: |
          make TARGET_N3DS=1 -j$(nproc)
          make TARGET_N3DS=1 cia

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-3ds-artifacts
          path: |
            build/*/*.3dsx
            build/*/*.cia
            

name: Build SM64 3DS Port

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 git wget libzip-dev libaudiofile-dev apt-transport-https gnupg

      - name: Setup devkitPro repository and pacman
        run: |
          sudo mkdir -p /usr/local/share/keyring/
          sudo wget -O /usr/local/share/keyring/devkitpro-pub.gpg https://apt.devkitpro.org/devkitpro-pub.gpg
          echo "deb [signed-by=/usr/local/share/keyring/devkitpro-pub.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman

      - name: Install 3DS toolchain packages
        run: |
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev 3ds-tools citro3d

      - name: Build and compile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$PATH:/opt/devkitpro/tools/bin
          
          cp project_asset_overrides/* . || true
          make VERSION=us PLATFORM=3ds -j4
          make VERSION=us cia -j4

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64-3ds-port
          path: |
            build/us_3ds/*.cia
            build/us_3ds/*.3dsx
